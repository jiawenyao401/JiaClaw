[package]
name = "jiaclaw"
version = "0.1.0"
edition = "2021"
authors = ["JiaWen Yao <jiawenyao401@users.noreply.github.com>"]
description = "Personal durable agent runtime built on StateKnot"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jiawenyao401/JiaClaw"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11.23", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
anyhow = "1.0"

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"

[lib]
name = "jiaclaw"
path = "src/lib.rs"

[[bin]]
name = "jiaclaw"
path = "src/main.rs"

[workspace]
members = [
    "crates/jiaclaw",
    "crates/jiaclaw-core",
    "crates/jiaclaw-host",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["JiaClaw contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jiawenyao401/JiaClaw"
homepage = "https://github.com/jiawenyao401/JiaClaw"

[workspace.dependencies]
# StateKnot framework - using git dependency for pre-alpha version
# NOTE: StateKnot requires Rust edition 2024 (future version, requires nightly or Rust 1.88+)
# Currently commented out until the toolchain requirement is met.
# Uncomment when using Rust nightly or when edition 2024 is stable.
#
# stateknot = { git = "https://github.com/StateKnot/StateKnot", rev = "84bae785764a5f3ece5de775024ce6951a098f70" }
# stateknot-core = { git = "https://github.com/StateKnot/StateKnot", rev = "84bae785764a5f3ece5de775024ce6951a098f70" }
# stateknot-runtime = { git = "https://github.com/StateKnot/StateKnot", rev = "84bae785764a5f3ece5de775024ce6951a098f70" }
# stateknot-integrations = { git = "https://github.com/StateKnot/StateKnot", rev = "84bae785764a5f3ece5de775024ce6951a098f70" }
# stateknot-store-postgres = { git = "https://github.com/StateKnot/StateKnot", rev = "84bae785764a5f3ece5de775024ce6951a098f70" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client - using minreq for simplicity and Rust 1.83 compatibility
minreq = { version = "2.12", features = ["json-using-serde", "https"] }

# Utilities
dirs = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
toml = "=0.5.11"
indexmap = "=2.7.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI - using version compatible with Rust 1.83 / edition 2021
clap = { version = "=4.4.18", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
